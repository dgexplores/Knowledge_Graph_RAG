[project]
name = "kg-rag"
version = "0.1.0"
description = "Hybrid knowledge-graph and vector RAG over relationship-rich enterprise data"
requires-python = ">=3.11"

dependencies = [
    "neo4j",
    "psycopg[binary,pool]",
    "pgvector",
    "fastapi",
    "uvicorn",
    "pydantic>=2",
    "anthropic",
    "langchain",
    "langchain-community",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
