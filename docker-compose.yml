# Local infrastructure. Neo4j is the graph of record; Postgres+pgvector holds the passages.
# The shared `chunk_id` across both is the hybrid join key (docs/02-data-model.md).
#
#   docker compose up -d
#   python scripts/seed_neo4j.py      # constraints + indexes from 02-data-model.md
#   python scripts/seed_postgres.py    # pgvector extension + chunks table

services:
  neo4j:
    image: neo4j:5-community
    container_name: kg-rag-neo4j
    ports:
      - "7474:7474"   # HTTP
      - "7687:7687"   # bolt
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:-kg_rag_dev}"
      NEO4J_server_memory_pagecache_size: 512M
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  postgres:
    image: pgvector/pgvector:pg16
    container_name: kg-rag-postgres
    ports:
      # 5433, not 5432: a Homebrew PostgreSQL 16 already listens on 5432 on this machine and
      # other projects depend on it. Moving this container is far cheaper than breaking those.
      - "5433:5432"
    environment:
      POSTGRES_DB: kg_rag
      POSTGRES_USER: kg_rag
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-kg_rag_dev}"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kg_rag -d kg_rag"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  neo4j_data:
  pg_data:
